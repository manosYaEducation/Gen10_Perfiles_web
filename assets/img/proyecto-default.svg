<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1b2e23" />
      <stop offset="50%" stop-color="#2d4a38" />
      <stop offset="100%" stop-color="#14221a" />
    </linearGradient>
    <linearGradient id="brandGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#4CAF50" />
      <stop offset="100%" stop-color="#81c784" />
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.12" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.04" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="450" fill="url(#bgGrad)"/>

  <!-- Decorative Pattern Grid -->
  <g opacity="0.08" stroke="#ffffff" stroke-width="1">
    <path d="M0,50 H800 M0,100 H800 M0,150 H800 M0,200 H800 M0,250 H800 M0,300 H800 M0,350 H800 M0,400 H800" />
    <path d="M100,0 V450 M200,0 V450 M300,0 V450 M400,0 V450 M500,0 V450 M600,0 V450 M700,0 V450" />
  </g>

  <!-- Floating Circles / Glows -->
  <circle cx="150" cy="100" r="180" fill="#4CAF50" opacity="0.08" filter="blur(40px)"/>
  <circle cx="680" cy="350" r="160" fill="#81c784" opacity="0.1" filter="blur(50px)"/>

  <!-- Main Card Graphic Mockup -->
  <g filter="url(#shadow)">
    <rect x="220" y="90" width="360" height="240" rx="16" fill="url(#cardGrad)" stroke="#4CAF50" stroke-width="1.5" stroke-opacity="0.4"/>
    
    <!-- Browser Top Bar -->
    <path d="M220,106 a16,16 0 0,1 16,-16 h328 a16,16 0 0,1 16,16 v24 h-360 z" fill="#ffffff" fill-opacity="0.08"/>
    <circle cx="244" cy="102" r="4" fill="#ff5f56"/>
    <circle cx="258" cy="102" r="4" fill="#ffbd2e"/>
    <circle cx="272" cy="102" r="4" fill="#27c93f"/>

    <!-- Placeholder Content Graphic -->
    <!-- Code Lines / Icons -->
    <rect x="250" y="145" width="120" height="12" rx="4" fill="url(#brandGrad)"/>
    <rect x="250" y="170" width="220" height="8" rx="3" fill="#ffffff" fill-opacity="0.3"/>
    <rect x="250" y="188" width="180" height="8" rx="3" fill="#ffffff" fill-opacity="0.2"/>
    <rect x="250" y="206" width="260" height="8" rx="3" fill="#ffffff" fill-opacity="0.2"/>

    <!-- Center Icon -->
    <g transform="translate(380, 240)">
      <circle cx="0" cy="0" r="32" fill="#4CAF50" fill-opacity="0.2" stroke="#4CAF50" stroke-width="2"/>
      <path d="M-12,-10 L-2,0 L-12,10 M2,-10 L12,0 L2,10" fill="none" stroke="#ffffff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
  </g>

  <!-- Text Label -->
  <text x="400" y="375" font-family="'Poppins', 'Segoe UI', sans-serif" font-size="20" font-weight="600" fill="#ffffff" text-anchor="middle" letter-spacing="1">
    KREATIVE ALPHA DOCERE
  </text>
  <text x="400" y="402" font-family="'Poppins', 'Segoe UI', sans-serif" font-size="14" font-weight="300" fill="#81c784" text-anchor="middle" opacity="0.9">
    Proyecto en Desarrollo • Vista Previa
  </text>
</svg>
