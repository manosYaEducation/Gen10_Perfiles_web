<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar sesión</title>

    <!-- Aplicar tema ANTES de renderizar cualquier cosa para evitar parpadeo -->
    <script>
        if (localStorage.getItem('darkMode') === 'true') {
            document.documentElement.classList.add('dark-mode');
        }
    </script>

    <link rel="stylesheet" href="./css/auth/login.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="icon" href="../assets/img/letra-k.png" type="image/x-icon">
</head>

<body>
    <!-- Dark Mode Toggle -->
    <button class="dark-mode-toggle" id="darkModeToggle" aria-label="Toggle dark mode">
        <i class="fas fa-moon"></i>
    </button>

    <div class="login-container">
        <div class="login-logo">
            <img src="../assets/img/kreativenofondo.png" alt="Logo" class="avatar">
        </div>

        <h1>Iniciar sesión</h1>

        <form class="login-form">
            <div class="form-group">
                <label for="username">Usuario</label>
                <input type="text" id="username" name="username" placeholder="Usuario" required>
            </div>

            <div class="form-group">
                <label for="password">Contraseña</label>
                <div class="password-input-container">
                    <input type="password" id="password" name="password" placeholder="Contraseña" required>
                    <i class="bi bi-eye-slash hide-show" id="togglePassword"></i>
                </div>
            </div>

            <button class="login-button" type="submit">Iniciar sesión</button>

            <div class="form-footer">
                <div class="remember-me">
                    <input type="checkbox" id="mantenerSesion" name="mantenerSesion">
                    <label for="mantenerSesion">Recordarme</label>
                </div>
                <a href="forgot-password.html" class="forgot-password">Recuperar contraseña</a>
            </div>
        </form>
    </div>

    <div id="back-to-top" class="back-to-top">
        <a href="../index.html" class="arrow">←</a>
    </div>

    <div id="modalError-Login" class="modal">
        <div class="modal-content">
            <span id="cerrarModal" class="close">&times;</span>
            <h2 id="h2modalError-Login">Error</h2>
            <p id="mensajeError">Usuario o contraseña incorrectos</p>
        </div>
    </div>

    <script src="./js/login.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/jsencrypt@3.0.0-rc.1/bin/jsencrypt.min.js"></script>
    <script>
        // Sincronizar icono del toggle con el tema actual al cargar
        const darkModeToggle = document.getElementById('darkModeToggle');

        function aplicarIcono() {
            const isDark = document.documentElement.classList.contains('dark-mode');
            // Sincronizar clase dark-mode en body también (los estilos CSS apuntan a body.dark-mode)
            if (isDark) {
                document.body.classList.add('dark-mode');
                darkModeToggle.querySelector('i').className = 'fas fa-sun';
            } else {
                document.body.classList.remove('dark-mode');
                darkModeToggle.querySelector('i').className = 'fas fa-moon';
            }
        }

        // Aplicar estado inicial del icono
        aplicarIcono();

        // Click en el toggle
        darkModeToggle.addEventListener('click', function () {
            const isDark = document.documentElement.classList.toggle('dark-mode');
            localStorage.setItem('darkMode', isDark);
            aplicarIcono();
        });
    </script>
</body>

</html>
