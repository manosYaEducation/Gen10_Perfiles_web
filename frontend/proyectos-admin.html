<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Proyectos - Gen10 Alpha Docere</title>
    <link href="../frontend/css/admin/index-admin.css" rel="stylesheet" />
    <link rel="stylesheet" href="../frontend/css/base/footer.css">
    <link rel="stylesheet" href="../frontend/css/proyectos.css">
    <link rel="stylesheet" href="../frontend/css/modal-detalle-proyecto.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Poppins:wght@100;200;300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <style>
        .projects-section {
            max-width: 1200px;
            margin: auto;
            padding: 20px;
            text-align: center;
        }
        
        .info-title {
            font-size: 24px;
            margin-bottom: 20px;
        }
        
        .create-project-btn {
            background-color: #4CAF50;
            color: white;
            padding: 10px 20px;
            border: none;
            cursor: pointer;
            font-size: 16px;
            margin-bottom: 20px;
        }

        .create-project-btn:hover {
            background-color: #45a049;
        }

    </style>
</head>
<body>
    <header>
        <nav>
            <div class="nav-left">
                <a href="../index.html" class="back-to-site">
                </a>
                <img src="../assets/img/kreativenofondo.png" alt="Icono" class="icon">
            </div>
            <div class="navbar" id="navbar">
                <ul class="headernav">
                    <li><a class="button-53" href="../index.html">Inicio</a></li>
                    <li><a class="button-53" href="../frontend/ordenes-servicios.html">Ordenes Servicios</a></li>
                    <li><a class="button-53" href="../frontend/proyectos-admin.html">Proyectos</a></li>
                    <li><a class="button-53" href="../frontend/index-admin.html">Panel de Administrador</a></li>
                    <li><a class="button-53" href="#" onclick="cerrarSesion()">Cerrar sesión</a></li>
                </ul>
            </div>
            <div class="hamburger" id="hamburger">
                <span></span>
                <span></span>
                <span></span>
            </div>
        </nav>
    </header>

    <section class="projects-section">
        <div class="info-container">
            <button class="create-project-btn" onclick="window.location.href='proyecto-crear.html'">Crear nuevo proyecto</button>
            <!--<h1 class="info-title">Lista de Proyectos</h1>-->
        </div>

        <!-- Proyectos Activos -->
        <div id="seccion-activos" style="display: none;">
            <h2 style="color: #4CAF50; margin-top: 30px;">Proyectos Activos</h2>
            <div class="contenedor-cards" id="tablaProyectosActivos">
                <!-- Los proyectos activos se cargan dinámicamente aquí -->
            </div>
        </div>

        <!-- Proyectos StandBy -->
        <div id="seccion-standby" style="display: none;">
            <h2 style="color: #f0ad4e; margin-top: 30px;">Proyectos en Standby</h2>
            <div class="contenedor-cards" id="tablaProyectosStandBy">
                <!-- Los proyectos en standby se cargan dinámicamente aquí -->
            </div>
        </div>

        <!-- Proyectos Finalizados -->
        <div id="seccion-finalizados" style="display: none;">
            <h2 style="color: #5cb2b8; margin-top: 30px;">Proyectos Finalizados</h2>
            <div class="contenedor-cards" id="tablaProyectosFinalizados">
                <!-- Los proyectos finalizados se cargan dinámicamente aquí -->
            </div>
        </div>

        <!-- Proyectos Sin Clasificar -->
        <div id="seccion-sin-clasificar" style="display: none;">
            <h2 style="color: #ff0000; margin-top: 30px;">Proyectos Sin Clasificar</h2>
            <div class="contenedor-cards" id="tablaProyectosSinClasificar">
                <!-- Los proyectos sin clasificar se cargan dinámicamente aquí -->
            </div>
        <!-- Modal Detalle de Proyecto -->
        <div id="modal-detalle-proyecto" class="modal-proyecto-overlay" aria-hidden="true">
            <div class="modal-proyecto-container">
                <button class="modal-proyecto-cerrar" id="cerrar-modal-proyecto" aria-label="Cerrar modal">&times;</button>
                <div id="modal-proyecto-contenido">
                    <!-- Contenido cargado dinámicamente -->
                </div>
            </div>
        </div>

    </section>   
    <script src="./js/config.js"></script>  
    <script src="./js/project-admin.js"></script>
    
    <script src="../frontend/js/logout.js"></script>
    <script src="../frontend/js/verifylogin.js"></script>
    <script src="../frontend/js/timeout.js"></script>
    <script src="../frontend/js/hamburger-menu.js"></script>

    <div id="footer-container"></div>
    <script>
      fetch('../frontend/components/footer.html')
        .then(response => response.text())
        .then(data => {
          document.getElementById('footer-container').innerHTML = data;
        });
    </script>
    
    <!-- Font Awesome para los íconos -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</body>
</html>
